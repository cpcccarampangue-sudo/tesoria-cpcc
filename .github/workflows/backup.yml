name: Backup semanal Supabase

# Corre los domingos 05:00 UTC (02:00 Chile). También se puede lanzar a mano.
on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Ejecutar pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Falta el secreto SUPABASE_DB_URL"
            exit 1
          fi
          FILE="backup-$(date +%F).sql.gz"
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-acl | gzip > "$FILE"
          ls -lh "$FILE"
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.sql.gz
          retention-days: 90
